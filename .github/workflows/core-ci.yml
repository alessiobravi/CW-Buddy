name: Cross-platform Core CI

on:
  # A pull request gates the merge, and a push to main gates the release:
  # every push to main publishes one, and this matrix is the only build that
  # proves the core still compiles and passes on all four platforms with no Qt
  # present. Without the push trigger a release could be published from a main
  # that no dependency-free job had ever seen.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 / MSVC
            os: windows-2025
            configure-arguments: -A x64
          - name: Linux x64 / GCC
            os: ubuntu-24.04
            configure-arguments: ""
          - name: macOS ARM64 / Apple Clang
            os: macos-15
            configure-arguments: -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: macOS x64 / Apple Clang
            os: macos-15-intel
            configure-arguments: -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCWA_BUILD_TESTS=ON
          ${{ matrix.configure-arguments }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  project-records:
    name: Changelog, backlog, and manuals updated
    # Pull requests only, and deliberately so. The check compares the event's
    # base revision against its head, and a push event carries neither: run on
    # a push it would hand the script two empty revisions and fail the release
    # gate on a comparison it was never given anything to compare. The records
    # a push publishes were already checked on the pull request that produced
    # the commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify project records
        shell: bash
        run: >-
          bash scripts/check-project-records.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
